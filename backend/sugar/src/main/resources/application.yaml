spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_ACCESS_KEY}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true

springdoc:
  api-docs:
    enabled: true
#  swagger-ui:  ##配置后返回404
#    path: /swagger-ui.html
#    title: AiDi
#    version: 1.0.0

wxpay:
  appid: wx1234567890abcdef  # 你的小程序AppID
  mchid: 1230000109           # 你的商户号
  api-v3-key: "yourApiV3Key"  # APIv3密钥
  mch-serial-no: "yourMchSerialNo"  # 商户证书序列号
  notify-url: "https://your-domain.com/api/wxpay/notify" # 回调地址
  connect-timeout: 5000
  read-timeout: 10000